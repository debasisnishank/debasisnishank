<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Debasis Nishank, Full-Stack and IoT / Cloud Developer. A satellite orbiting Earth.">
  <defs>
    <radialGradient id="sky" cx="75%" cy="60%" r="90%">
      <stop offset="0" stop-color="#12233f"/>
      <stop offset="1" stop-color="#050913"/>
    </radialGradient>
    <radialGradient id="earth" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#3fa7d6"/>
      <stop offset=".55" stop-color="#14508c"/>
      <stop offset="1" stop-color="#071f3d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset=".72" stop-color="#5fd3ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5fd3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#sky)"/>

  <g fill="#dfeaff">
    <circle cx="48" cy="44" r="1.2"/><circle cx="126" cy="292" r="1"/><circle cx="212" cy="30" r="1.4"/>
    <circle cx="298" cy="306" r="1"/><circle cx="372" cy="26" r="1"/><circle cx="446" cy="312" r="1.3"/>
    <circle cx="520" cy="46" r="1"/><circle cx="604" cy="22" r="1.4"/><circle cx="668" cy="300" r="1"/>
    <circle cx="742" cy="38" r="1.2"/><circle cx="1128" cy="52" r="1.3"/><circle cx="1172" cy="150" r="1"/>
    <circle cx="830" cy="24" r="1"/><circle cx="1040" cy="22" r="1"/><circle cx="24" cy="190" r="1"/>
    <circle cx="684" cy="96" r="1.1"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="290" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="120" r="1.2"><animate attributeName="opacity" values="1;.3;1" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="960" cy="400" r="222" fill="url(#glow)"/>
  <circle cx="960" cy="400" r="170" fill="url(#earth)"/>

  <ellipse id="orbit" cx="960" cy="330" rx="250" ry="130" fill="none" stroke="#5fd3ff" stroke-opacity=".45" stroke-width="1" stroke-dasharray="4 7"/>
  <g>
    <animateMotion dur="24s" repeatCount="indefinite" path="M710,330 a250,130 0 1,1 500,0 a250,130 0 1,1 -500,0"/>
    <rect x="-7" y="-5" width="14" height="10" rx="1.5" fill="#e8eefc"/>
    <rect x="-29" y="-4" width="19" height="8" fill="#5fd3ff"/>
    <rect x="10" y="-4" width="19" height="8" fill="#5fd3ff"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#e8eefc" stroke-width="1.5"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="92" fill="#5fd3ff" font-size="15" letter-spacing="3">// GROUND CONTROL ONLINE</text>
    <text x="62" y="162" fill="#f2f6ff" font-size="56" font-weight="700">Debasis Nishank</text>
    <text x="64" y="204" fill="#b9c8e4" font-size="21">Full-Stack &amp; IoT / Cloud Developer</text>
    <text x="64" y="250" fill="#7f93b5" font-size="15">19.22°N 72.98°E  ·  Thane, India</text>
  </g>
</svg>
